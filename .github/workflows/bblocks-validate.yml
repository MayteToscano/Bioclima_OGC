name: Validate Building Blocks

on:
  push:
    branches: [main]
    paths:
      - '_sources/**'
      - 'scripts/**'
      - 'bblocks-config.yaml'
      - 'github/workflows/**'
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rdflib pyshacl jsonschema pyyaml

      - name: Validate JSON schemas
        run: |
          python scripts/validate-schemas.py

      - name: Validate SHACL shapes against ontologies
        run: |
          python scripts/validate-shacl.py

      - name: Build concepts index for the viewer
        run: |
          python scripts/build-concepts-index.py

      - name: Build register.json
        run: |
          python scripts/build-register.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bioclima-build
          path: |
            build/register.json
            viewer/data/concepts.json

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: bioclima-build
          path: ./

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload site (viewer + sources)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
