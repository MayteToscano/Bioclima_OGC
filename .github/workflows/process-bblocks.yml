name: Validate and process Building Blocks

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'build/**'
      - 'build-local/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  validate-and-process:
    name: Validate and process
    uses: opengeospatial/bblocks-postprocess/.github/workflows/validate-and-process.yml@master
    with:
      test_outputs_path: build-local/tests

      before_postprocess: |
        rm -rf build/tests
        rm -rf build-local/tests
        git rm -r --cached build/tests build-local/tests 2>/dev/null || true
        echo "build-local/" >> .git/info/exclude
        echo "build/tests/" >> .git/info/exclude

      before_pages: |
        rm -rf build-local
        rm -rf build/tests
        find . -type f -size +50M -print -delete || true

    secrets:
      sparql_username: ${{ secrets.sparql_username }}
      sparql_password: ${{ secrets.sparql_password }}
