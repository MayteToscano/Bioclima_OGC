<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioClima OGC Viewer</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- chroma-scale for color ramps -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>

  <link rel="stylesheet" href="css/viewer.css" />
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>BioClima</h1>
      <p class="subtitle" data-i18n="subtitle">OGC Building Blocks viewer</p>
    </header>

    <section class="control">
      <label for="lang-select" data-i18n="language">Language</label>
      <select id="lang-select">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="zh">中文</option>
        <option value="ro">Română</option>
      </select>
    </section>

    <section class="control">
      <label data-i18n="layers">Layers</label>
      <div id="layer-list"></div>
    </section>

    <section class="control" id="time-controls" hidden>
      <label data-i18n="time">Time</label>
      <div class="time-row">
        <button id="btn-play" aria-label="Play / pause">▶</button>
        <input type="range" id="time-slider" min="0" max="0" value="0" />
        <span id="time-label">—</span>
      </div>
    </section>

    <section class="control">
      <label data-i18n="legend">Legend</label>
      <div id="legend"></div>
    </section>

    <footer>
      <p data-i18n="footer">Register: <a href="../build/register.json">register.json</a></p>
    </footer>
  </aside>

  <main id="map"></main>

  <!-- Click info panel -->
  <aside id="info-panel" hidden>
    <button id="info-close" aria-label="Close">✕</button>
    <h2 id="info-title">—</h2>
    <p class="info-definition" id="info-definition"></p>
    <dl id="info-properties"></dl>
    <h3 data-i18n="policy">Policy alignment</h3>
    <ul id="info-policy"></ul>
    <p class="info-source"><a id="info-iri" href="#" target="_blank">▸ View concept</a></p>
  </aside>

  <script src="js/i18n.js"></script>
  <script src="js/covjson.js"></script>
  <script src="js/viewer.js"></script>
</body>
</html>
