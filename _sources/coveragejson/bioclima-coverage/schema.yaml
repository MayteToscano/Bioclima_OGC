$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://maytetoscano.github.io/Bioclima_OGC/bblock/ogc.bioclima.coveragejson.bioclima-coverage/schema.yaml"
title: "BioClima CoverageJSON profile"
description: |
  Profile of CoverageJSON for BioClima EBV and Indicator datasets.
  Restricts the base CoverageJSON schema so that:
    - type MUST be "Coverage"
    - domain.referencing MUST include EPSG:4326 for the (x,y) coordinates
    - every parameter MUST have an observedProperty.id resolvable in the BioClima ontology
    - parameter labels SHOULD be available in en, es, zh and ro

type: object
required: [type, domain, parameters, ranges]
properties:
  type:
    const: Coverage
  domain:
    type: object
    required: [type, axes, referencing]
    properties:
      type:
        const: Domain
      domainType:
        type: string
        enum: [Grid, MultiPolygon, Trajectory, Point, PointSeries, VerticalProfile]
      axes:
        type: object
        properties:
          x: { type: object }
          y: { type: object }
          t:
            type: object
            description: Optional time axis. When present, values are ISO 8601 strings.
            properties:
              values:
                type: array
                items: { type: string, format: date-time }
      referencing:
        type: array
        minItems: 1
        contains:
          type: object
          properties:
            coordinates: { type: array, items: { type: string } }
            system:
              type: object
              properties:
                id:
                  const: "http://www.opengis.net/def/crs/EPSG/0/4326"

  parameters:
    type: object
    minProperties: 1
    additionalProperties:
      $ref: "#/$defs/Parameter"

  ranges:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      required: [type, dataType, axisNames, shape]
      properties:
        type: { const: NdArray }
        dataType:
          enum: [float, integer]
        axisNames:
          type: array
          items: { type: string }
        shape:
          type: array
          items: { type: integer }
        values:
          type: array
        nodata:
          type: number

  metadata:
    type: object
    additionalProperties: true

$defs:
  Parameter:
    type: object
    required: [type, observedProperty]
    properties:
      type:
        const: Parameter
      observedProperty:
        type: object
        required: [id, label]
        properties:
          id:
            type: string
            format: iri
            pattern: '^https://maytetoscano\.github\.io/Bioclima_OGC/'
            description: Must resolve to a SKOS Concept inside the BioClima ontology
          label:
            type: object
            description: Language-tagged labels. en is mandatory; es, zh and ro recommended.
            required: [en]
            properties:
              en: { type: string }
              es: { type: string }
              zh: { type: string }
              ro: { type: string }
          description:
            type: object
      unit:
        type: object
        properties:
          id:
            type: string
            format: iri
          label:
            type: object
          symbol:
            type: string
