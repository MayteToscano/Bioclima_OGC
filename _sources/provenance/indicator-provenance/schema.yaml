$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://maytetoscano.github.io/Bioclima_OGC/bblock/ogc.bioclima.provenance.indicator-provenance/schema.yaml"
title: "Indicator Provenance"
description: |
  PROV-O record specialised for indicator computation: ties together the
  EBVs used as input, the script that produced the result, the commit hash
  in which that script was executed and the GitHub Action run that triggered
  it.

type: object
required: [entity, wasGeneratedBy, wasDerivedFrom]
properties:
  entity:
    type: string
    format: iri
  wasDerivedFrom:
    type: array
    minItems: 1
    items: { type: string, format: iri }
  wasGeneratedBy:
    type: object
    required: [activity, script, scriptVersion, startedAtTime, endedAtTime]
    properties:
      activity:       { type: string }
      script:         { type: string, format: iri, description: "URL of the computation script" }
      scriptVersion:  { type: string, description: "git commit hash or semver" }
      recipe:         { type: string, format: iri }
      runId:          { type: string, description: "GitHub Actions run id, if applicable" }
      startedAtTime:  { type: string, format: date-time }
      endedAtTime:    { type: string, format: date-time }
      parameters:
        type: object
        additionalProperties: true
  wasAttributedTo:
    type: object
    properties:
      agent: { type: string }
      type:  { type: string, enum: [Person, SoftwareAgent, Organization] }
