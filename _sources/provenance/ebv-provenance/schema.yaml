$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://maytetoscano.github.io/Bioclima_OGC/bblock/ogc.bioclima.provenance.ebv-provenance/schema.yaml"
title: "EBV Provenance record"
description: |
  PROV-O encoded lineage for an EBV dataset. The 'entity' is the published
  EBV; 'wasDerivedFrom' lists raw sources; 'wasGeneratedBy' references the
  processing activity; 'wasAttributedTo' the responsible agent.

type: object
required: [entity, wasGeneratedBy, wasAttributedTo]
properties:
  "@context":
    type: object
  entity:
    type: string
    format: iri
    description: IRI of the EBV bblock or dataset
  wasDerivedFrom:
    type: array
    items: { type: string, format: iri }
  wasGeneratedBy:
    type: object
    required: [activity, startedAtTime, endedAtTime]
    properties:
      activity:       { type: string, description: "Name of the processing activity" }
      startedAtTime:  { type: string, format: date-time }
      endedAtTime:    { type: string, format: date-time }
      used:
        type: array
        items: { type: string, format: iri }
      hadPlan:
        type: string
        format: iri
        description: "IRI of a recipe.jsonld or methodology document"
  wasAttributedTo:
    type: object
    required: [agent, role]
    properties:
      agent: { type: string }
      role:  { type: string }
      organization: { type: string }
