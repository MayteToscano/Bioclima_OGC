$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://maytetoscano.github.io/Bioclima_OGC/bblock/ogc.bioclima.indicator.indicator-definition/schema.yaml"
title: "Indicator Definition (generic)"
description: |
  Recipe-style description of a biodiversity indicator: inputs, parameters,
  output unit, implementation entry point, and policy alignment.

type: object
required: [id, label, definition, inputs, implementation, output]

properties:
  id:
    type: string
    format: iri
    description: SKOS concept IRI inside the BioClima indicator vocabulary
  label:
    type: object
    required: [en]
    properties:
      en: { type: string }
      es: { type: string }
      zh: { type: string }
      ro: { type: string }
  definition:
    type: object
    required: [en]
    properties:
      en: { type: string }
      es: { type: string }
      zh: { type: string }
      ro: { type: string }
  inputs:
    type: array
    minItems: 1
    items:
      type: object
      required: [role, ebv]
      properties:
        role:        { type: string }
        ebv:         { type: string, format: iri }
        constraint:  { type: string, format: iri }
        minYears:    { type: integer, minimum: 1 }
  parameters:
    type: object
    additionalProperties: true
  implementation:
    type: object
    required: [language, entrypoint, version]
    properties:
      language:
        type: string
        enum: [python, r, julia]
      entrypoint:
        type: string
        description: "file#function (e.g. compute.py#compute_pci)"
      version:
        type: string
      requirements:
        type: string
        description: "requirements file name"
  output:
    type: object
    required: [unit]
    properties:
      unit:    { type: string, format: iri }
      spatial: { type: string }
      format:  { type: string, enum: [CoverageJSON, GeoJSON] }
  policyAlignment:
    type: array
    items: { type: string, format: iri }
