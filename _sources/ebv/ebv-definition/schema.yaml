$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://maytetoscano.github.io/Bioclima_OGC/bblock/ogc.bioclima.ebv.ebv-definition/schema.yaml"
title: "EBV Definition (generic)"
description: |
  Inventory schema for an Essential Biodiversity Variable dataset.
  Modelled after the GeoBON portal record (e.g. dataset id 10).

type: object
required:
  - id
  - title
  - doi
  - ebv
  - ebv_entity
  - ebv_metric
  - geospatial
  - time_coverage
  - license
  - creator

properties:
  id:
    type: string
    description: Internal identifier within the BioClima register
  naming_authority:
    type: string
  title:
    type: object
    description: Multilingual title
    required: [en]
    properties:
      en: { type: string }
      es: { type: string }
      zh: { type: string }
      ro: { type: string }
  product_version:
    type: string
  doi:
    type: string
  date_created:
    type: string
    format: date
  date_issued:
    type: string
    format: date
  summary:
    type: object
    required: [en]
    properties:
      en: { type: string }
      es: { type: string }
      zh: { type: string }
      ro: { type: string }
  keywords:
    type: array
    items: { type: string }
  references:
    type: array
    items: { type: string }
  source:
    type: string
  license:
    type: string
    format: iri

  creator:
    type: object
    required: [name, institution]
    properties:
      name:        { type: string }
      email:       { type: string, format: email }
      institution: { type: string }
      url:         { type: string }

  publisher:
    type: object
    properties:
      name:        { type: string }
      email:       { type: string, format: email }
      institution: { type: string }

  ebv:
    type: object
    required: [ebv_class, ebv_name]
    properties:
      ebv_class:
        type: string
        format: iri
        description: SKOS concept in bioclima ebv-vocabulary
      ebv_name:
        type: string
        format: iri

  ebv_entity:
    type: object
    required: [ebv_entity_type, ebv_entity_scope]
    properties:
      ebv_entity_type:
        type: string
        format: iri
      ebv_entity_scope:
        type: string
      ebv_entity_names:
        type: array
        items: { type: string }

  ebv_metric:
    type: object
    description: Map of metric_id -> metric description with multilingual labels
    additionalProperties:
      type: object
      required: [standard_name, long_name, units]
      properties:
        standard_name:
          type: object
          required: [en]
          properties:
            en: { type: string }
            es: { type: string }
            zh: { type: string }
            ro: { type: string }
        long_name:
          type: object
        units:
          type: string
          format: iri

  geospatial:
    type: object
    required: [crs, lat_min, lat_max, lon_min, lon_max]
    properties:
      crs:             { type: string }
      lat_resolution:  { type: string }
      lon_resolution:  { type: string }
      lat_min:         { type: number }
      lat_max:         { type: number }
      lon_min:         { type: number }
      lon_max:         { type: number }
      scope:           { type: string, enum: [National, Regional, Continental, Global] }
      description:     { type: string }

  time_coverage:
    type: object
    required: [start, end]
    properties:
      resolution: { type: string }
      start:      { type: string, format: date }
      end:        { type: string, format: date }

  ebv_domain:
    type: array
    items:
      enum: [Terrestrial, Marine, Freshwater, Atmospheric]

  comment:
    type: string

  dataset:
    type: object
    required: [coverage]
    properties:
      coverage:
        type: string
        description: Relative path (within the bblock) to the CoverageJSON file
      metadata_json:
        type: string
      metadata_xml:
        type: string
