$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://maytetoscano.github.io/Bioclima_OGC/bblock/ogc.bioclima.policy.kmgbf-target/schema.yaml"
title: "Kunming-Montreal GBF Target"

type: object
required: [id, targetNumber, label, definition]
properties:
  id:
    type: string
    format: iri
  targetNumber:
    type: integer
    minimum: 1
    maximum: 23
  label:
    type: object
    required: [en]
    properties:
      en: { type: string }
      es: { type: string }
      zh: { type: string }
      ro: { type: string }
  definition:
    type: object
    required: [en]
    properties:
      en: { type: string }
      es: { type: string }
      zh: { type: string }
      ro: { type: string }
  deadline:
    type: string
    format: date
  keyIndicators:
    type: array
    items: { type: string, format: iri }
  source:
    type: string
    format: iri
